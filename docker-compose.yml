# 医智助手 · Docker Compose 部署
# 前端 Nginx(3000) + 后端 gunicorn(8010) + MySQL8 + Milvus v2.5.6 + Attu WebUI
services:
  mysql:
    image: mysql:8.0
    container_name: medical-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: medical-assistant-master
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: medical-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  minio:
    # 修正：全部使用英文短横杠
    image: minio/minio:latest
    container_name: medical-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: medical-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  attu:
    image: zilliz/attu:v2.5.12
    container_name: medical-attu
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      - milvus
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medical-backend
    environment:
      DB_TYPE: mysql
      DATABASE_NAME: medical-assistant-master
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MILVUS_ENABLE: "1"
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-xxx}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-deepseek-chat}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-}
      EMBED_DIM: ${EMBED_DIM:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-80}
      # 是否把章节路径（如「第3章 糖尿病 > 3.1 分型」）拼到 chunk 文本前
      CHUNK_HEADING_PREFIX: ${CHUNK_HEADING_PREFIX:-1}
      # PDF：清洗跨页重复的页眉/页脚/页码；提取字符数低于该值视为扫描件
      PDF_STRIP_HEADER_FOOTER: ${PDF_STRIP_HEADER_FOOTER:-1}
      PDF_MIN_TEXT_CHARS: ${PDF_MIN_TEXT_CHARS:-50}
      TOP_K: ${TOP_K:-5}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.30}
      BACKEND_PORT: 8010
      JWT_SECRET: ${JWT_SECRET:-medical-assistant-secret-key-2024}
    ports:
      - "8010:8010"
    volumes:
      - uploads_data:/app/backend/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medical-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  uploads_data: