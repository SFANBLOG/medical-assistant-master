# 医智助手 · Docker Compose 部署（按代码实测校准，2026-08-30 重新生成）
#
# 架构：前端 Nginx(3000) + 后端 gunicorn(8010) + MySQL 8.0 + Milvus v2.5.6 + Attu + etcd + MinIO
#
# 重要说明（以本文件为准，勿照搬《部署说明.md》）：
# 1. 组件版本：MySQL 8.0 / etcd v3.5.12 / Milvus v2.5.6 / Attu v2.5.12。
#    《部署说明.md》里出现的 Redis、etcd v3.5.18、Milvus v2.5.4、MySQL 8.0.40 均与实际不符。
# 2. 本编排【不包含 Redis】：backend/services/cache.py 为死代码（无任何模块 import，且在架构 A 下首行
#    `from config import Config` 必然 ImportError），项目运行不依赖 Redis，相关配置可忽略。
# 3. 环境变量可通过项目根目录 .env 覆盖（Docker Compose 自动读取），未设置时取下方默认值。
#    所有变量名均对照 backend/config.py 实测，不存在失效变量（如 DATABASE_PATH / JWT_EXPIRES_HOURS /
#    QUERY_PREFIX / MILVUS_DB 等均未被读取，已排除）。
# 4. 演示账号见 README：patientdemo / doctordemo / nursedemo / publicdemo / admindemo，密码统一 demo123。
#
# 启动：   docker compose up -d --build
# 日志：   docker compose logs -f backend
# 停止：   docker compose down
# 清数据： docker compose down -v   （会删除 mysql/etcd/minio/milvus/uploads 卷，向量需重新索引）

services:
  mysql:
    image: mysql:8.0
    container_name: medical-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: medical-assistant-master
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主 3307 -> 容器 3306：避免与本机已占用的 3306 冲突。
      # 容器内后端通过服务名 mysql:3306 访问，不受此映射影响。
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  etcd:
    # v3.5.16：本机已拉取该镜像，避免联网拉取超时；Milvus 2.5.x 兼容 etcd 3.5 全系。
    image: quay.io/coreos/etcd:v3.5.16
    container_name: medical-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    # Milvus 的对象存储。要点（均已实测）：
    # 1. 新版 MinIO 只认 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD，
    #    旧变量 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 已废弃，写旧变量会导致凭据不生效。
    # 2. 健康检查用 curl 打 /minio/health/live（镜像内置 curl）。
    #    不可用 `mc ready local` —— 该镜像没有预置名为 local 的 alias，必然失败。
    # 3. Milvus 侧仍用 MINIO_ACCESS_KEY/SECRET_KEY 变量传递同一套凭据（见 milvus 服务）。
    image: minio/minio:latest
    container_name: medical-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: medical-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus 侧读取的变量名（与 MinIO 的 ROOT_USER/PASSWORD 是同一套凭据）
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Milvus 就绪后 9091 端口的 /healthz 返回 200；镜像内自带 curl。
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      # standalone 首次启动拉起 etcd/minio/索引服务等较慢，给足宽限避免误判不健康
      start_period: 120s
    restart: unless-stopped

  attu:
    # Milvus 可视化管理界面（需与 Milvus 大版本一致：v2.5.x）
    image: zilliz/attu:v2.5.12
    container_name: medical-attu
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medical-backend
    environment:
      DB_TYPE: mysql
      DATABASE_NAME: medical-assistant-master
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MILVUS_ENABLE: "1"
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      # Milvus 就绪前不发起连接；后端仅向业已 healthy 的 milvus 发起握手，
      # 因此连得上才用、连不上也不降级——日志里不再出现「连接失败/降级」字样。
      MILVUS_CONNECT_TIMEOUT: "3"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-xxx}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-deepseek-chat}
      # 刻意写死为空、不从根目录 .env 继承：.env 里的 ./backend/data/models/bge-base-zh-v1.5
      # 在宿主机上并不存在（实际是 HF 缓存格式 models/models/BAAI--bge-base-zh-v1.5），
      # 且容器默认未装 sentence-transformers/torch，继承过去只会打印「加载失败/回退」。
      # 留空 = 使用内置确定性哈希向量（零依赖、离线可用、启动零报错），
      # 检索质量由 BM25 稀疏检索 + 融合重排兜底。
      # 需要真实 BGE 语义向量：见 .dockerignore 中 INSTALL_LOCAL_EMBED 的说明。
      OPENAI_EMBED_MODEL: ""
      EMBED_DIM: ${EMBED_DIM:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-80}
      # 是否把「章节路径」拼到 chunk 文本前（如「第3章 糖尿病 > 3.1 分型」）
      CHUNK_HEADING_PREFIX: ${CHUNK_HEADING_PREFIX:-1}
      # PDF：清洗跨页重复的页眉/页脚/页码；整篇提取字符数低于该值视为扫描件
      PDF_STRIP_HEADER_FOOTER: ${PDF_STRIP_HEADER_FOOTER:-1}
      PDF_MIN_TEXT_CHARS: ${PDF_MIN_TEXT_CHARS:-50}
      TOP_K: ${TOP_K:-5}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.30}
      # 混合检索（BM25 稀疏 + 稠密向量 + 重排）
      BM25_TOP_K: ${BM25_TOP_K:-30}
      DENSE_TOP_K: ${DENSE_TOP_K:-30}
      DENSE_MIN_SIMILARITY: ${DENSE_MIN_SIMILARITY:-0.0}
      RERANK_TOP_K: ${RERANK_TOP_K:-5}
      RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:-0.12}
      # 留空 = 关闭 Cross-Encoder，直接用「稠密 + BM25 + 词面」融合打分，
      # 无需 sentence-transformers/torch，启动不会打印模型加载失败。
      RERANK_MODEL_PATH: ""
      BACKEND_PORT: 8010
      JWT_SECRET: ${JWT_SECRET:-medical-assistant-secret-key-2024}
    ports:
      - "8010:8010"
    volumes:
      - uploads_data:/app/backend/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    # 首次启动会建库建表 + 播种约 241 篇演示文档（含本地 BGE 模型加载），耗时较长；
    # start_period 给足宽限，避免被误判为不健康。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 10
      # gunicorn --preload 下，master 进程需先完成「建库建表 + 播种 241 篇文档 +
      # 写入 Milvus」才会 fork worker，这段时间 /api/health 无响应是正常的。
      start_period: 300s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medical-frontend
    ports:
      - "3000:80"
    depends_on:
      # 等后端真正就绪（健康检查通过）后再起前端，避免首屏 502
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  uploads_data:
