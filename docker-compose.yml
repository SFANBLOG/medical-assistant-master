name: medical-assistant

services:
  # ---- MySQL 8 数据库（库名 medical-assistant-master，backend 启动时自动建表）----
  mysql:
    image: mysql:8.0.40
    container_name: medical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${DATABASE_NAME:-medical-assistant-master}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Milvus 向量库依赖：etcd（元数据）----
  etcd:
    container_name: medical-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---- Milvus 向量库依赖：MinIO（向量与索引存储）----
  minio:
    container_name: medical-milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---- Milvus 向量数据库（standalone，端口 19530）----
  milvus:
    container_name: medical-milvus
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  backend:
    build: ./backend
    container_name: medical-backend
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      DB_TYPE: mysql
      DATABASE_NAME: ${DATABASE_NAME:-medical-assistant-master}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      VECTOR_DIR: /data/vectors
      # 向量库：连接 docker-compose 内的 Milvus
      MILVUS_ENABLE: ${MILVUS_ENABLE:-1}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # 留空 -> 离线兜底模式；如需接入真实大模型，在 .env 中填写后重启即可
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      # 本地向量模型：默认 HF 模型 id（容器内自动从 hf-mirror.com 下载，需网络）。
      # 如需使用已下载的本地模型，可把 data/models 挂载进容器并设置
      # OPENAI_EMBED_MODEL=/data/models/bge-base-zh-v1.5（同时 volumes 增加 ./backend/data/models:/data/models:ro）。
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-BAAI/bge-base-zh-v1.5}
      EMBED_DIM: ${EMBED_DIM:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-380}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-60}
      TOP_K: ${TOP_K:-6}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.30}
      QUERY_PREFIX: ${QUERY_PREFIX:-}
      QUERY_EXPAND: ${QUERY_EXPAND:-1}
    volumes:
      - medical_data:/data
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8010/api/health',timeout=3); sys.exit(0)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: medical-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  medical_data:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
