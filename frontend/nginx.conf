server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（Vue Router history 模式）回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理（适配多种部署环境）：
    # - PocketBay/云平台：不通过 Nginx 代理，由平台自身路由 /api/* 到后端容器
    # - Docker Compose：proxy_pass http://backend:8010
    # - 单容器：通过 BACKEND_HOST 环境变量配置后端地址
    #   （如 export BACKEND_HOST=localhost:8080）
    location /api/ {
        if ($http_x_backend_url != "") {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $http_x_backend_url;
        }
        # 默认 Proxy 到 docker-compose 网络中的 backend 服务
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        # SSE 流式回答需要即时转发，关闭缓冲/缓存，否则前端 EventSource 收不到增量内容
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
